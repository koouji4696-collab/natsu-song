var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],

<style>
/* ============================================================
   なつのうた 専用スタイル
   外部CDNに頼らず、このファイルだけで見た目が完成します。
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  color:#0f172a;
  background:#f8fafc;
  -webkit-font-smoothing:antialiased;
}
h1,h2,p,pre,ul,figure{margin:0}
ul{list-style:none;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* 押した感じを出す */
button,a{transition:transform .12s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
button:active,a:active{transform:scale(.96)}

/* 入力欄 */
input,textarea,select{background:#fff;border-radius:1.1rem;outline:none}
select{padding:.5rem .9rem;border:4px solid #e2e8f0}
input::placeholder,textarea::placeholder{color:#94a3b8}

/* カードが増えたときにふわっと出す */
li{animation:nu-in .28s ease both}
@keyframes nu-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes nu-pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* 印刷（配布用シート） */
@media print{
  @page{ size:A4; margin:12mm; }
  body{ background:#fff !important; }
  .print\:hidden{ display:none !important; }
  .print\:rounded-none{ border-radius:0 !important; }
  .print\:p-0{ padding:0 !important; }
  .print\:shadow-none{ box-shadow:none !important; }
  .print\:break-inside-avoid{ break-inside:avoid; page-break-inside:avoid; }
  #qr-print-area{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; gap:8mm !important; }
}
@media screen{
  .print\:hidden{ display:revert; }
}

let seq = 1;

const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const toLines = (w,per=2) => chunk(w,per).map(l=>l.join("　")).join("\n");
const rotate = (a,k) => a.length===0 ? a : [...a.slice(k%a.length), ...a.slice(0,k%a.length)];

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try {
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      document.body.removeChild(ta); return true;
    } catch(e2){ return false; }
  }
}

/* ---------- GASウェブアプリとの通信 ----------
   Content-Type を text/plain にしているのは、
   ブラウザのプリフライト（OPTIONS）を避けるため。
   GASはOPTIONSに応答できないので、これが定石。
-------------------------------------------------- */
const CFG = window.APP_CONFIG || {};
const API = (CFG.API_BASE || "").trim();
const TOKEN = CFG.APP_TOKEN || "";

async function gas(action, payload){
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action, token: TOKEN }, payload || {})),
  });
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

const apiGetState = () => gas("get");
const apiSetState = (key, value) => gas("set", { key, value });
const apiReset = (session) => gas("reset", { session: session || null });

/* ---------- 写真の読み取り ---------- */
function shrinkToBase64(file, maxSide=1400){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*scale);
      cv.height = Math.round(img.height*scale);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg",0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読めません")); };
    img.src = url;
  });
}

const OCR_PROMPT =
  "小学生が付箋に書いた「夏の思い出」の写真です。付箋を1枚ずつ読み取ってください。\n" +
  "・文字が書いてある付箋は、書かれたとおりの日本語で書き起こす（ひらがな・カタカナもそのまま）\n" +
  "・絵だけの付箋は、その絵の内容を小学生が言いそうな短い日本語にする（例：花火の絵→「はなびがきれい」）\n" +
  "・1枚につき1つ、15文字くらいまでの短いフレーズにする\n" +
  "・読み取れない付箋、付箋以外の物、人の名前は入れない\n" +
  "出力は文字列のJSON配列だけ。前置き・説明・コードブロック記号は一切書かないこと。\n" +
  '例: ["うみでおよいだ","すいかがあまかった"]';

async function readStickyNotes(file){
  const b64 = await shrinkToBase64(file);
  const data = await gas("claude", { messages: [{ role:"user", content:[
    { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:b64 } },
    { type:"text", text: OCR_PROMPT }
  ]}]});
  const text = (data.content||[]).filter(i=>i.type==="text").map(i=>i.text).join("\n");
  const clean = text.replace(/```json|```/g,"").trim();
  const parsed = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]")+1));
  return Array.isArray(parsed) ? parsed.filter(t=>typeof t==="string") : [];
}

/* ---------- 歌詞づくり ---------- */
function miniLyrics(group, words, genreId){
  const genre = GENRES.find(g=>g.id===genreId) || GENRES[0];
  if(words.length===0) return "（ことばを入れると、ここに歌ができるよ）";

  // 言葉が多いほど [Verse] を増やす（1ブロックにつき最大6語）
  const per = 6;
  const verseWords = words.slice(0, Math.max(words.length - 2, per)); // 最後の2語はサビ用に残す
  const chorusWords = words.slice(-2);
  const blocks = chunk(verseWords.length ? verseWords : words, per);

  const out = [];
  blocks.forEach((b, i)=>{
    out.push("[Verse" + (blocks.length > 1 ? " " + (i+1) : "") + "]");
    out.push(toLines(b, 2));
    if(i === 0) out.push(genre.hook + " ぼくらの なつやすみ");
    out.push("");
  });
  out.push("[Chorus]");
  out.push(group.name + "のなつ! " + words[0]);
  out.push(toLines(chorusWords.length ? chorusWords : words.slice(0,2), 2));
  out.push("わすれないよ このきもち");
  out.push(genre.hook + " " + genre.hook + " ぼくらのうた");
  return out.join("\n");
}
function groupStyleText(genreId){

}

function QrCode({ text, size=140 }){
  const svg = useMemo(()=>{
    if(!text || typeof window === "undefined" || !window.qrcode) return "";
    try{
      const qr = window.qrcode(0, "M"); // 0 = 自動でサイズ判定
      qr.addData(text);
      qr.make();
      return qr.createSvgTag({ scalable: true });
    }catch(e){ return ""; }
  },[text]);
  if(!svg) return <div style={{width:size,height:size}} className="flex items-center justify-center rounded-xl bg-slate-100 text-sm text-slate-400">QR未生成</div>;
  return <div style={{width:size,height:size}} dangerouslySetInnerHTML={{__html: svg}} />;
}

/* ============================================================

function useSpeech(onFinal){
  const [listening,setListening] = useState(false);
  const [interim,setInterim] = useState("");
  const [ok,setOk] = useState(true);
  const recogRef = useRef(null);
  const cbRef = useRef(onFinal);
  useEffect(()=>{ cbRef.current = onFinal; });

  useEffect(()=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ setOk(false); return; }
    const r = new SR();
    r.lang="ja-JP"; r.continuous=true; r.interimResults=true;
    r.onresult = (ev)=>{
      let temp="";
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const res=ev.results[i]; const t=res[0].transcript.trim();
        if(res.isFinal){ if(t) cbRef.current([t]); } else temp+=t;
      }
      setInterim(temp);
    };
    r.onend = ()=>{ setListening(false); setInterim(""); };
    r.onerror = ()=>{ setListening(false); setInterim(""); };
    recogRef.current = r;
    return ()=>{ try{ r.stop(); }catch(e){} };
  },[]);

  const toggle = ()=>{
    const r=recogRef.current; if(!r) return;
    if(listening){ try{ r.stop(); }catch(e){} setListening(false); }
    else { try{ r.start(); setListening(true); }catch(e){ setListening(false); } }
  };
  return { listening, interim, ok, toggle };
}

function StudentApp(){

  const [songUrl,setSongUrl] = useState("");

  const [sessionLabel,setSessionLabel] = useState("");
  const [switched,setSwitched] = useState(false);
  const [stamp,setStamp] = useState(0);
  const [sync,setSync] = useState("idle");
  const [showSong,setShowSong] = useState(false);
  const [photoState,setPhotoState] = useState("idle");
  const [photoMsg,setPhotoMsg] = useState("");
  const [thumb,setThumb] = useState(null);
  const [editingId,setEditingId] = useState(null);
  const [editText,setEditText] = useState("");
  const fileRef = useRef(null);
  const stateRef = useRef({ stamp:0, group:null, songUrl:"", sid:null });

  useEffect(()=>{ stateRef.current = { stamp, group, songUrl, sid }; },[stamp,group,songUrl,sid]);

  const push = async (nextCards, nextGenre)=>{
    const s = stateRef.current;
    if(!s.group || !s.sid) return;
    const at = Date.now(); setStamp(at);
    try{
      await apiSetState(K(s.sid,"g"+s.group.id), { groupId:s.group.id, genre:nextGenre, cards:nextCards, songUrl:s.songUrl||"", updatedAt:at });
      setSync("ok");
    }catch(e){ setSync("ng"); }
  };

  const pull = async ()=>{
    try{
      const all = await apiGetState();
      const list = (all.sessions && all.sessions.items) || [];
      const cur = all.current && all.current.id ? all.current.id : null;

      if(!cur){ setSid(null); setSync("ok"); return; }
      setSessionLabel(labelOf(list, cur));

      const s = stateRef.current;
      if(cur !== s.sid){
        // 先生が回を切り替えた。前の回の内容は持ち越さない
        if(s.sid) setSwitched(true);
        setSid(cur); setCards([]); setGenre("kirakira"); setStamp(0); setSongUrl("");
        stateRef.current = { ...s, sid:cur, stamp:0, songUrl:"" };
      }

      const g = stateRef.current.group;
      if(g){
        const d = all[K(cur,"g"+g.id)];
        if(d){
          if((d.updatedAt||0) > stateRef.current.stamp){
            setCards(d.cards||[]); setGenre(d.genre||"kirakira"); setStamp(d.updatedAt||0);
          }
          setSongUrl(d.songUrl||"");
        }
      }
      const fin = all[K(cur,"finale")];
      setFinaleUrl((fin && fin.url) || "");
      setSync("ok");
    }catch(e){ setSync("ng"); }
  };

  // 班を選ぶ前から回を見張る（先生が回を始めた瞬間に画面が変わる）
  useEffect(()=>{
    pull();
    const t = setInterval(pull, STUDENT_POLL_MS);
    return ()=>clearInterval(t);
  },[]);

  useEffect(()=>{ if(group) pull(); },[group]);

  const addCards = (texts)=>{
    const clean = texts.map(t=>String(t).trim()).filter(Boolean);
    if(!clean.length) return;
    setCards(prev=>{
      const next=[...prev, ...clean.map(t=>({id:newId(), text:t, part:null}))];
      push(next, genre); return next;
    });
  };
  const speech = useSpeech(addCards);

  const removeCard = (id)=> setCards(prev=>{ const n=prev.filter(c=>c.id!==id); push(n,genre); return n; });
  const saveEdit = ()=>{
    const t=editText.trim();
    if(t) setCards(prev=>{ const n=prev.map(c=>c.id===editingId?{...c,text:t}:c); push(n,genre); return n; });
    setEditingId(null); setEditText("");
  };
  const pickGenre = (g)=>{ setGenre(g); push(cards,g); };

  const onPickPhoto = async (e)=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    setPhotoState("reading"); setPhotoMsg("");
    try{
      setThumb(URL.createObjectURL(file));
      const found = await readStickyNotes(file);
      if(!found.length){ setPhotoState("error"); setPhotoMsg("ふせんが読めませんでした。明るいところで まっすぐ とってみてね。"); }
      else { addCards(found); setPhotoState("done"); setPhotoMsg(found.length + "まい 読みとったよ！ ちがっていたら ✏️ でなおしてね。"); }
    }catch(err){ setPhotoState("error"); setPhotoMsg("うまく読めませんでした：" + err.message); }
    if(fileRef.current) fileRef.current.value="";
  };

  if(!sid){
    return (
      <div className="min-h-screen bg-gradient-to-b from-sky-300 via-cyan-100 to-amber-100 p-6">
        <div className="mx-auto max-w-3xl">
          <h1 className="mb-1 text-4xl font-black text-slate-800">☀️ なつのことば あつめ</h1>
          <div className="mt-8 rounded-3xl border-4 border-white bg-white/90 p-8 text-center shadow-lg">
            <p className="text-6xl">⏳</p>
            <p className="mt-4 text-2xl font-black text-slate-600">先生が はじめるのを まっててね</p>
            <p className="mt-2 text-lg font-bold text-slate-400">
              {sync==="ng" ? "つうしんできていません" : "じゅんびちゅう…"}
            </p>
          </div>
        </div>
      </div>
    );
  }

  if(!group){
    return (
      <div className="min-h-screen bg-gradient-to-b from-sky-300 via-cyan-100 to-amber-100 p-6">
        <div className="mx-auto max-w-3xl">
          <h1 className="mb-1 text-4xl font-black text-slate-800">☀️ なつのことば あつめ</h1>
          <p className="mb-1 text-lg font-black text-sky-600">🗓️ {sessionLabel}</p>
          <p className="mb-8 text-2xl font-bold text-slate-500">じぶんの班を タップしてね</p>
          <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
            {GROUPS.map(g=>(
              <button key={g.id} onClick={()=>setGroup(g)}
                className={"rounded-3xl border-4 border-white py-12 text-4xl font-black text-white shadow-xl active:scale-95 " + g.solid + " " + g.hover}>
                <span className="mr-3 text-6xl">{g.emoji}</span>{g.name}
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const words = cards.map(c=>c.text);

  return (
    <div className="min-h-screen bg-gradient-to-b from-sky-200 via-cyan-100 to-amber-100 p-4">
      <div className="mx-auto max-w-3xl space-y-4">
        <header className={"flex flex-wrap items-center justify-between gap-3 rounded-3xl border-4 border-white p-5 shadow-lg " + group.solid}>
          <div className="flex items-center gap-3">
            <button onClick={()=>setGroup(null)} className="rounded-2xl bg-white/25 px-4 py-3 text-2xl text-white active:scale-95">←</button>
            <span className="text-5xl">{group.emoji}</span>
            <div>
              <h1 className="text-3xl font-black text-white">{group.name}</h1>
              <p className="text-lg font-bold text-white/90">
                {cards.length >= group.target ? cards.length + "こ あつまった！✨" : cards.length + " / " + group.target + " こ"} ・ {sessionLabel}
              </p>
            </div>
          </div>
          <div className="rounded-2xl bg-white/25 px-4 py-2 text-lg font-black text-white">
            {sync==="ng" ? "⚠️ とどいていません" : "☁️ 先生にとどいたよ"}
          </div>
        </header>

        {switched && (
          <section className="rounded-3xl border-4 border-sky-300 bg-white p-5 shadow-lg">
            <p className="text-2xl font-black text-sky-600">🔄 あたらしい回が はじまりました</p>
            <p className="mt-2 text-lg font-bold text-slate-500">まえの回の ことばは のこっているので、あんしんしてね。</p>
            <button onClick={()=>setSwitched(false)}
              className="mt-3 rounded-2xl bg-sky-500 px-5 py-3 text-xl font-black text-white shadow active:scale-95">わかった</button>
          </section>
        )}

        {(songUrl || finaleUrl) && (
          <section className="rounded-3xl border-4 border-yellow-300 bg-white p-5 shadow-lg">
            <p className="mb-3 text-2xl font-black text-orange-600">できた うた 🎶</p>
            <div className="space-y-3">
              {songUrl && <a href={songUrl} target="_blank" rel="noopener noreferrer"
                className={"block rounded-2xl py-5 text-center text-2xl font-black text-white shadow " + group.solid}>▶ {group.name}の うたを きく</a>}
              {finaleUrl && <a href={finaleUrl} target="_blank" rel="noopener noreferrer"
                className="block rounded-2xl bg-gradient-to-r from-orange-500 to-pink-500 py-5 text-center text-2xl font-black text-white shadow">🌟 みんなの うたを きく</a>}
            </div>
          </section>
        )}

        <section className="rounded-3xl border-4 border-white bg-white/90 p-5 shadow-lg">
          <p className="mb-3 text-2xl font-black text-slate-600">① こえで入れる</p>
          {speech.ok ? (
            <React.Fragment>
              <button onClick={speech.toggle}
                className={"w-full rounded-3xl py-10 text-3xl font-black text-white shadow-lg active:scale-95 " + (speech.listening ? "animate-pulse bg-red-500" : group.solid + " " + group.hover)}>
                {speech.listening ? "🔴 きいてるよ！ とめる" : "🎤 おして はなす"}
              </button>
              {speech.interim && <p className="mt-3 rounded-2xl bg-slate-100 p-4 text-xl text-slate-500">…{speech.interim}</p>}
            </React.Fragment>
          ) : (
            <p className="rounded-2xl bg-yellow-100 p-4 text-xl font-bold text-yellow-800">このiPadでは こえが つかえません。②の しゃしんを つかってね。</p>
          )}
        </section>

        <section className="rounded-3xl border-4 border-white bg-white/90 p-5 shadow-lg">
          <p className="mb-1 text-2xl font-black text-slate-600">② 写真で撮る</p>
          <p className="mb-3 text-lg font-bold text-slate-400">ふせんに 字や絵を かいて、ならべて とってね</p>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={onPickPhoto} className="hidden" />
          <button onClick={()=>fileRef.current && fileRef.current.click()} disabled={photoState==="reading"}
            className={"w-full rounded-3xl py-10 text-3xl font-black text-white shadow-lg active:scale-95 " + (photoState==="reading" ? "bg-slate-400" : group.solid + " " + group.hover)}>
            {photoState==="reading" ? "⏳ 読みとり中…" : "📷 ふせんを うつす"}
          </button>
          {thumb && <img src={thumb} alt="とった写真" className="mt-3 max-h-48 w-full rounded-2xl border-4 border-slate-200 object-contain" />}
          {photoMsg && <p className={"mt-3 rounded-2xl p-4 text-xl font-bold " + (photoState==="error" ? "bg-rose-100 text-rose-700" : "bg-emerald-100 text-emerald-700")}>{photoMsg}</p>}
        </section>

        <section className="rounded-3xl border-4 border-white bg-white/90 p-5 shadow-lg">
          <p className="mb-3 text-2xl font-black text-slate-600">{group.name}の ことば</p>
          {cards.length===0 ? (
            <p className="rounded-2xl border-4 border-dashed border-slate-200 p-8 text-center text-xl text-slate-400">まだ ことばが ありません</p>
          ) : (
            <ul className="space-y-3">
              {cards.map((c,i)=>(
                <li key={c.id} className={"flex items-center gap-3 rounded-2xl border-4 p-4 " + group.soft + " " + group.border}>
                  <span className={"flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-xl font-black text-white " + group.solid}>{i+1}</span>
                  {editingId===c.id ? (
                    <input value={editText} autoFocus onChange={e=>setEditText(e.target.value)}
                      onKeyDown={e=>e.key==="Enter"&&saveEdit()} onBlur={saveEdit}
                      className="flex-1 rounded-xl border-4 border-slate-300 px-3 py-2 text-2xl" />
                  ) : (
                    <span className="flex-1 text-2xl font-bold">{c.text}</span>
                  )}
                  <button onClick={()=>{setEditingId(c.id); setEditText(c.text);}} className="rounded-xl bg-white p-3 text-2xl shadow-sm active:scale-95">✏️</button>
                  <button onClick={()=>removeCard(c.id)} className="rounded-xl bg-white p-3 text-2xl shadow-sm active:scale-95">🗑️</button>
                </li>
              ))}
            </ul>
          )}
          {cards.length >= group.target && (
            <p className="mt-4 rounded-2xl bg-emerald-100 p-4 text-center text-xl font-black text-emerald-700">
              ✅ ぜんいん入ったね！ もっと入れても だいじょうぶだよ
            </p>
          )}
        </section>

        <section className="rounded-3xl border-4 border-white bg-white/90 p-5 shadow-lg">
          <p className="mb-3 text-2xl font-black text-slate-600">🎵 どんな曲にする？</p>
          <div className="grid grid-cols-2 gap-3 sm:grid-cols-3">
            {GENRES.map(g=>(
              <button key={g.id} onClick={()=>pickGenre(g.id)}
                className={"rounded-2xl border-4 px-2 py-5 shadow-sm active:scale-95 " + (genre===g.id ? "border-white text-white " + group.solid : "border-slate-200 bg-white text-slate-600")}>
                <div className="text-5xl">{g.emoji}</div>
                <div className="text-2xl font-black">{g.label}</div>
                <div className="text-base font-bold opacity-80">{g.sub}</div>
              </button>
            ))}
          </div>
        </section>

        <section className="rounded-3xl border-4 border-white bg-white/90 p-5 shadow-lg">
          <button onClick={()=>setShowSong(v=>!v)} className="w-full text-left text-2xl font-black text-slate-600">
            ✨ {group.name}の かしを 見る {showSong ? "▲" : "▼"}
          </button>
          {showSong && <pre className="mt-3 rounded-2xl bg-slate-900 p-5 text-xl leading-relaxed text-lime-200">{miniLyrics(group, words, genre)}</pre>}
        </section>
      </div>
    </div>
  );
}

/* ============================================================
   教員コンソールの入り口（合言葉）
   本格的な認証ではなく、生徒がうっかり／興味本位で入るのを防ぐための目隠し。
   合言葉は config.js に書かれており、ページのソースを見れば分かる。
   ============================================================ */
function TeacherGate({ children }){
  const [unlocked,setUnlocked] = useState(false);
  const [pin,setPin] = useState("");
  const [wrong,setWrong] = useState(false);
  const need = CFG.TEACHER_PIN || "";

  if(!need || unlocked) return children;

  const submit = ()=>{
    if(pin === need){ setUnlocked(true); setWrong(false); }
    else { setWrong(true); setPin(""); }
  };

  return (
    <div className="min-h-screen bg-gradient-to-b from-slate-200 via-slate-100 to-sky-50 p-6">
      <div className="mx-auto mt-16 max-w-md rounded-3xl border-4 border-white bg-white/90 p-8 text-center shadow-xl">
        <p className="text-5xl">🔒</p>
        <h1 className="mt-3 text-2xl font-black text-slate-700">教員コンソール</h1>
        <p className="mt-2 text-lg font-bold text-slate-500">合言葉を入力してください</p>
        <input value={pin} onChange={e=>setPin(e.target.value)}
          onKeyDown={e=>e.key==="Enter" && submit()}
          type="password" inputMode="numeric" autoFocus
          className="mt-4 w-full rounded-2xl border-4 border-slate-200 px-4 py-3 text-center text-2xl tracking-widest focus:border-slate-400 focus:outline-none" />
        {wrong && <p className="mt-2 text-lg font-bold text-rose-600">ちがいます。もう一度どうぞ。</p>}
        <button onClick={submit} className="mt-4 w-full rounded-2xl bg-slate-700 py-4 text-xl font-black text-white shadow active:scale-95">入る</button>
      </div>
    </div>
  );
}

/* ============================================================
   教員用画面
   ============================================================ */
function TeacherApp(){
  const emptyData = ()=>{ const d={}; GROUPS.forEach(g=>d[g.id]={genre:"kirakira",cards:[],songUrl:"",updatedAt:0}); return d; };
  const [tab,setTab] = useState(1);
  const [data,setData] = useState(emptyData);
  const [finale,setFinale] = useState({genre:"idol", url:""});
  const [sid,setSid] = useState(null);
  const [sessions,setSessions] = useState([]);
  const [live,setLive] = useState(true);
  const [conn,setConn] = useState("idle");
  const [connMsg,setConnMsg] = useState("");
  const [lastSync,setLastSync] = useState(null);
  const [seed,setSeed] = useState(0);
  const [done,setDone] = useState({});
  const [editingId,setEditingId] = useState(null);
  const [editText,setEditText] = useState("");
  const [bulk,setBulk] = useState("");
  const [draft,setDraft] = useState("");
  const [photoState,setPhotoState] = useState("idle");
  const [photoMsg,setPhotoMsg] = useState("");
  const fileRef = useRef(null);
  const editingRef = useRef(null);
  const sidRef = useRef(null);
  useEffect(()=>{ editingRef.current = editingId; },[editingId]);
  useEffect(()=>{ sidRef.current = sid; },[sid]);

  const pullAll = async ()=>{
    if(editingRef.current) return;
    try{
      const all = await apiGetState();
      setSessions((all.sessions && all.sessions.items) || []);

      const cur = all.current && all.current.id ? all.current.id : null;
      setConn("ok"); setConnMsg(""); setLastSync(new Date());
      if(!cur){ setSid(null); return; }

      const changed = cur !== sidRef.current;
      if(changed){ sidRef.current = cur; setSid(cur); setDone({}); setTab(1); }

      setData(prev=>{
        const next={};
        GROUPS.forEach(g=>{
          const d = all[K(cur,"g"+g.id)];
          next[g.id] = d ? {
            genre: d.genre||"kirakira",
            songUrl: d.songUrl||"",
            cards: (d.cards||[]).map(c=>({ id:c.id||newId(), text:c.text, part:c.part||defaultPartFor(g.id) })),
            updatedAt: d.updatedAt||0,
          } : (changed ? { genre:"kirakira", cards:[], songUrl:"", updatedAt:0 } : prev[g.id]);
        });
        return next;
      });

      const fin = all[K(cur,"finale")];
      if(fin) setFinale({ genre: fin.genre||"idol", url: fin.url||"" });
      else if(changed) setFinale({ genre:"idol", url:"" });
    }catch(e){ setConn("ng"); setConnMsg(e.message); }
  };

  useEffect(()=>{
    if(!live) return;
    pullAll();
    const t = setInterval(pullAll, TEACHER_POLL_MS);
    return ()=>clearInterval(t);
  },[live]);

  const updateGroup = (groupId, updater)=>{
    setData(prev=>{
      const cur = prev[groupId] || {genre:"kirakira",cards:[],songUrl:""};
      const next = updater(cur);
      if(!sidRef.current){ return prev; }
      apiSetState(K(sidRef.current,"g"+groupId), { groupId, genre:next.genre, cards:next.cards, songUrl:next.songUrl||"", updatedAt: Date.now() })
        .then(()=>setConn("ok")).catch(err=>{ setConn("ng"); setConnMsg(err.message); });
      return { ...prev, [groupId]: { ...next, updatedAt: Date.now() } };
    });
  };

  const writeFinale = (nextFinale)=>{
    setFinale(nextFinale);
    if(!sidRef.current) return;
    apiSetState(K(sidRef.current,"finale"), { ...nextFinale, updatedAt: Date.now() }).catch(err=>{ setConn("ng"); setConnMsg(err.message); });
  };

  /* ---------- 回の操作 ---------- */

  const startSession = async (labelInput)=>{
    const base = todayStamp();
    const nth = sessions.filter(s=>s.id.indexOf(base) === 0).length + 1;
    const d = new Date();
    const id = base + "-" + nth;
    const label = (labelInput && labelInput.trim())
      ? labelInput.trim()
      : (d.getMonth()+1) + "/" + d.getDate() + " 第" + nth + "回";
    const next = [...sessions, { id, label }];
    try{
      await apiSetState("sessions", { items: next, updatedAt: Date.now() });
      await apiSetState("current", { id, updatedAt: Date.now() });
      setSessions(next); sidRef.current = id; setSid(id);
      setData(emptyData()); setFinale({genre:"idol", url:""}); setDone({}); setTab(1);
    }catch(err){ setConn("ng"); setConnMsg(err.message); }
  };

  const switchSession = async (id)=>{
    if(!id || id === sid) return;
    try{
      await apiSetState("current", { id, updatedAt: Date.now() });
      sidRef.current = id; setSid(id);
      setData(emptyData()); setFinale({genre:"idol", url:""}); setDone({}); setTab(1);
      pullAll();
    }catch(err){ setConn("ng"); setConnMsg(err.message); }
  };

  const renameSession = async ()=>{
    if(!sid) return;
    const cur = labelOf(sessions, sid);
    const name = window.prompt("この回の名前", cur);
    if(name === null) return;
    const next = sessions.map(s=> s.id===sid ? { ...s, label: name.trim() || cur } : s);
    try{
      await apiSetState("sessions", { items: next, updatedAt: Date.now() });
      setSessions(next);
    }catch(err){ setConn("ng"); setConnMsg(err.message); }
  };

  const addCards = (groupId, texts)=>{
    const clean = texts.map(t=>String(t).trim()).filter(Boolean);
    if(!clean.length) return;
    updateGroup(groupId, cur=>({ ...cur, cards:[...cur.cards, ...clean.map(t=>({id:newId(), text:t, part:defaultPartFor(groupId)}))] }));
  };
  const removeCard = (groupId,id)=> updateGroup(groupId, cur=>({ ...cur, cards: cur.cards.filter(c=>c.id!==id) }));
  const saveEdit = (groupId)=>{
    const t = editText.trim();
    if(t) updateGroup(groupId, cur=>({ ...cur, cards: cur.cards.map(c=>c.id===editingId?{...c,text:t}:c) }));
    setEditingId(null); setEditText("");
  };
  const setGenre = (groupId,genre)=> updateGroup(groupId, cur=>({...cur, genre}));
  const setSongUrl = (groupId,songUrl)=> updateGroup(groupId, cur=>({...cur, songUrl}));
  const cyclePart = (groupId,id)=> updateGroup(groupId, cur=>({ ...cur,
    cards: cur.cards.map(c=> c.id===id ? {...c, part: PART_ORDER[(PART_ORDER.indexOf(c.part)+1)%PART_ORDER.length]} : c) }));
  const setGroupPart = (groupId,part)=> updateGroup(groupId, cur=>({ ...cur, cards: cur.cards.map(c=>({...c, part})) }));

  const loadDemo = ()=>{
    GROUPS.forEach(g=>{
      const cards = (DEMO[g.id]||[]).map(t=>({id:newId(), text:t, part:defaultPartFor(g.id)}));
      updateGroup(g.id, cur=>({...cur, cards}));
    });
  };
  const clearSession = async ()=>{
    if(!sid) return;
    if(!window.confirm("「" + labelOf(sessions, sid) + "」の言葉を全部消します。ほかの回は残ります。よろしいですか？")) return;
    try{ await apiReset(sid); }catch(e){}
    setData(emptyData()); setFinale({genre:finale.genre, url:""}); setDone({});
  };

  const clearEverything = async ()=>{
    if(!window.confirm("すべての回のデータを消します。元に戻せません。よろしいですか？")) return;
    try{ await apiReset(null); }catch(e){}
    setSessions([]); sidRef.current = null; setSid(null);
    setData(emptyData()); setFinale({genre:"idol", url:""}); setDone({});
  };

  const onPickPhoto = async (groupId, e)=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    setPhotoState("reading"); setPhotoMsg("");
    try{
      const found = await readStickyNotes(file);
      if(!found.length){ setPhotoState("error"); setPhotoMsg("付箋を読み取れませんでした。明るい場所で真上から撮り直してください。"); }
      else { addCards(groupId, found); setPhotoState("done"); setPhotoMsg(found.length + "件を読み取りました。誤読は ✏️ で修正できます。"); }
    }catch(err){ setPhotoState("error"); setPhotoMsg("読み取りに失敗しました：" + err.message); }
    if(fileRef.current) fileRef.current.value="";
  };

  const allCards = useMemo(()=>GROUPS.flatMap(g=>(data[g.id]?.cards||[]).map(c=>({...c, groupId:g.id}))),[data]);
  const total = allCards.length;
  const progress = Math.min(100, Math.round(total/TOTAL_MEMBERS*100));

  const groupLyrics = (g)=>{
    const words = rotate((data[g.id]?.cards||[]).map(c=>c.text), seed);
    if(!words.length) return "（" + g.name + "の言葉が届くと、ここに歌詞が出ます）";
    return miniLyrics(g, words, data[g.id]?.genre);
  };

  const finaleLyrics = useMemo(()=>{
    if(!allCards.length) return "（言葉が届くと、ここに29人の歌詞が出ます）";
    const pick = p => rotate(allCards.filter(c=>c.part===p).map(c=>c.text), seed);
    const v1=pick("v1"), v2=pick("v2"), br=pick("br"), ch=pick("ch");
    const core = ch.length ? ch : rotate(allCards.map(c=>c.text), seed+3).slice(0,4);
    const hook = "キラキラ ひかる ぼくらの なつ";
    return [
      "[Intro]","ラララ… なつのおと","みんなでうたおう せーの!","",
      "[Verse 1]", v1.length?toLines(v1,2):"（1番に言葉を割り振ってください）","",
      "[Chorus]", hook, toLines(core.slice(0,4),2), "て を つないで もういちど","",
      "[Verse 2]", v2.length?toLines(v2,2):"（2番に言葉を割り振ってください）","",
      "[Chorus]", hook, toLines(core.slice(0,4),2), "て を つないで もういちど","",
      "[Bridge]", br.length?toLines(br,2):"（ブリッジに言葉を割り振ってください）","なつは おわっても きえないよ","",
      "[Chorus]","（大合唱）", hook, toLines(core,2), "29人の うたが そらへ","",
      "[Outro]","ラララ… またあおうね","ぼくらの なつやすみ",
    ].join("\n");
  },[allCards,seed]);

  const finaleStyle = useMemo(()=>{
    const g = FINALE_GENRES.find(x=>x.id===finale.genre) || FINALE_GENRES[0];
    return g.style + ", japanese lyrics, 29 elementary school children, big group chorus, layered harmonies, grand finale, joyful and emotional";
  },[finale.genre]);

  const songListText = useMemo(()=>{
    const rows = GROUPS.filter(g=>data[g.id]?.songUrl).map(g=>g.name + "：" + data[g.id].songUrl);
    if(finale.url) rows.push("全体ソング：" + finale.url);
    return rows.length ? rows.join("\n") : "（まだ登録された曲がありません）";
  },[data, finale.url]);

  const active = typeof tab === "number" ? GROUPS.find(g=>g.id===tab) : null;

  return (
    <div className="min-h-screen bg-gradient-to-b from-slate-100 via-sky-50 to-amber-50 p-4 text-slate-800">
      <header className="mx-auto mb-4 max-w-7xl rounded-3xl border-4 border-white bg-gradient-to-r from-indigo-500 via-sky-500 to-teal-400 p-5 shadow-xl">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h1 className="text-3xl font-black text-white drop-shadow md:text-4xl">☀️ 教員コンソール</h1>
            <p className="text-lg font-bold text-white/90">生徒の入力を受信 → Sunoで曲にする → 曲URLを登録</p>
          </div>
          <div className="flex flex-wrap gap-2">
            <button onClick={loadDemo} className="rounded-2xl bg-white px-4 py-3 text-lg font-black text-indigo-600 shadow-md active:scale-95">🪄 デモデータ一括投入</button>
            <button onClick={clearSession} className="rounded-2xl bg-white/85 px-4 py-3 text-lg font-black text-slate-600 shadow-md active:scale-95">🗑️ この回を消去</button>
            <a href="#" className="rounded-2xl bg-white/85 px-4 py-3 text-lg font-black text-slate-600 shadow-md">👦 生徒用へ</a>
          </div>
        </div>

        <div className="mt-4 flex flex-wrap items-center gap-3 rounded-2xl bg-white/90 p-4">
          <span className="text-xl font-black text-slate-700">🗓️ いまの回</span>
          {sessions.length > 0 && (
            <select value={sid||""} onChange={e=>switchSession(e.target.value)}
              className="rounded-2xl border-4 border-slate-200 px-4 py-2 text-lg font-black text-slate-700">
              {sessions.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}

<!-- 起動処理：CDNを二重化し、失敗したら画面にエラーを出す -->
<script>
(function () {
  var CDNS = [
    { name: "unpkg",    base: "https://unpkg.com/" },
    { name: "jsDelivr", base: "https://cdn.jsdelivr.net/npm/" }
  ];
  var LIBS = [
    "react@18/umd/react.production.min.js",
    "react-dom@18/umd/react-dom.production.min.js",
    "@babel/standalone/babel.min.js"
  ];
  var log = [];

  function show(title, lines) {
    var html = '<div id="boot"><h1>' + title + "</h1><ul>";
    for (var i = 0; i < lines.length; i++) html += "<li>" + lines[i] + "</li>";
    html += "</ul></div>";
    document.getElementById("root").innerHTML = html;
  }

  function loadScript(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = url;
      s.crossOrigin = "anonymous";
      s.onload = function () { resolve(url); };
      s.onerror = function () { reject(new Error(url)); };
      document.head.appendChild(s);
    });
  }

  function loadWithFallback(path, i) {
    i = i || 0;
    if (i >= CDNS.length) return Promise.reject(new Error(path + " をどのCDNからも読めませんでした"));
    return loadScript(CDNS[i].base + path).then(
      function () { log.push(path.split("/")[0] + " ← " + CDNS[i].name); },
      function () { return loadWithFallback(path, i + 1); }
    );
  }

  // React → ReactDOM → Babel の順に読む
  LIBS.reduce(function (p, path) {
    return p.then(function () { return loadWithFallback(path); });
  }, Promise.resolve())
    .then(function () {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      var s = document.createElement("script");
      s.textContent = out;
      document.body.appendChild(s);
    })
    .catch(function (err) {
      show("部品を読み込めませんでした", [
        "エラー: <code>" + err.message + "</code>",
        "学校のネットワークやブラウザ拡張が CDN を止めている可能性があります。",
        "スマホのテザリングなど別の回線で開くと切り分けできます。",
        "読み込めたもの: " + (log.length ? log.join(" / ") : "なし")
      ]);
    });

  // 起動後のエラーも画面に出す
  window.addEventListener("error", function (e) {
    if (document.getElementById("boot") || !document.getElementById("root").firstChild) {
      show("エラーが発生しました", [
        "<code>" + (e.message || "不明なエラー") + "</code>",
        e.filename ? "場所: <code>" + e.filename + " : " + e.lineno + "</code>" : "",
        "この文面をそのまま伝えてください。"
      ]);
    }
  });
})();
</script>
</body>
</html>
