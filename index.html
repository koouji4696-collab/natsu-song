let seq = 1;
const newId = () => "w" + Date.now().toString(36) + (seq++);
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const toLines = (w,per=2) => chunk(w,per).map(l=>l.join("　")).join("\n");
const rotate = (a,k) => a.length===0 ? a : [...a.slice(k%a.length), ...a.slice(0,k%a.length)];

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try {
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      document.body.removeChild(ta); return true;
    } catch(e2){ return false; }
  }
}

/* ---------- GASウェブアプリとの通信 ----------
   Content-Type を text/plain にしているのは、
   ブラウザのプリフライト（OPTIONS）を避けるため。
   GASはOPTIONSに応答できないので、これが定石。
-------------------------------------------------- */
const CFG = window.APP_CONFIG || {};
const API = (CFG.API_BASE || "").trim();
const TOKEN = CFG.APP_TOKEN || "";

async function gas(action, payload){
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action, token: TOKEN }, payload || {})),
  });
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

const apiGetState = () => gas("get");
const apiSetState = (key, value) => gas("set", { key, value });
const apiReset = () => gas("reset");

/* ---------- 写真の読み取り ---------- */
function shrinkToBase64(file, maxSide=1400){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*scale);
      cv.height = Math.round(img.height*scale);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg",0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読めません")); };
    img.src = url;
  });
}

const OCR_PROMPT =
  "小学生が付箋に書いた「夏の思い出」の写真です。付箋を1枚ずつ読み取ってください。\n" +
  "・文字が書いてある付箋は、書かれたとおりの日本語で書き起こす（ひらがな・カタカナもそのまま）\n" +
  "・絵だけの付箋は、その絵の内容を小学生が言いそうな短い日本語にする（例：花火の絵→「はなびがきれい」）\n" +
  "・1枚につき1つ、15文字くらいまでの短いフレーズにする\n" +
  "・読み取れない付箋、付箋以外の物、人の名前は入れない\n" +
  "出力は文字列のJSON配列だけ。前置き・説明・コードブロック記号は一切書かないこと。\n" +
  '例: ["うみでおよいだ","すいかがあまかった"]';

async function readStickyNotes(file){
  const b64 = await shrinkToBase64(file);
  const data = await gas("claude", { messages: [{ role:"user", content:[
    { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:b64 } },
    { type:"text", text: OCR_PROMPT }
  ]}]});
  const text = (data.content||[]).filter(i=>i.type==="text").map(i=>i.text).join("\n");
  const clean = text.replace(/```json|```/g,"").trim();
  const parsed = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]")+1));
  return Array.isArray(parsed) ? parsed.filter(t=>typeof t==="string") : [];
}

function miniLyrics(group, words, genreId){
  const genre = GENRES.find(g=>g.id===genreId) || GENRES[0];
  if(words.length===0) return "（ことばを入れると、ここに歌ができるよ）";
  const rest = words.slice(4);
  return [
    "[Verse]",
    toLines(words.slice(0,4),2),
    genre.hook + " ぼくらの なつやすみ",
    "",
    "[Chorus]",
    group.name + "のなつ! " + words[0],
    toLines(rest.length ? rest : words.slice(0,2),2),
    "わすれないよ このきもち",
    genre.hook + " " + genre.hook + " ぼくらのうた",
  ].join("\n");
}

/* ============================================================
   音声入力
   ============================================================ */
function useSpeech(onFinal){
  const [listening,setListening] = useState(false);
  const [interim,setInterim] = useState("");
  const [ok,setOk] = useState(true);
  const recogRef = useRef(null);
  const cbRef = useRef(onFinal);
  useEffect(()=>{ cbRef.current = onFinal; });

  useEffect(()=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ setOk(false); return; }
    const r = new SR();
    r.lang="ja-JP"; r.continuous=true; r.interimResults=true;
    r.onresult = (ev)=>{
      let temp="";
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const res=ev.results[i]; const t=res[0].transcript.trim();
        if(res.isFinal){ if(t) cbRef.current([t]); } else temp+=t;
      }
      setInterim(temp);
    };
    r.onend = ()=>{ setListening(false); setInterim(""); };
    r.onerror = ()=>{ setListening(false); setInterim(""); };
    recogRef.current = r;
    return ()=>{ try{ r.stop(); }catch(e){} };
  },[]);

  const toggle = ()=>{
    const r=recogRef.current; if(!r) return;
    if(listening){ try{ r.stop(); }catch(e){} setListening(false); }
    else { try{ r.start(); setListening(true); }catch(e){ setListening(false); } }
  };
  return { listening, interim, ok, toggle };
}

            <p className="rounded-2xl bg-yellow-100 p-4 text-xl font-bold text-yellow-800">このiPadでは こえが つかえません。②の しゃしんを つかってね。</p>
          )}
        </section>

        <section className="rounded-3xl border-4 border-white bg-white/90 p-5 shadow-lg">
          <p className="mb-1 text-2xl font-black text-slate-600">② 写真で撮る</p>
          <p className="mb-3 text-lg font-bold text-slate-400">ふせんに 字や絵を かいて、ならべて とってね</p>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={onPickPhoto} className="hidden" />
          <button onClick={()=>fileRef.current && fileRef.current.click()} disabled={photoState==="reading"}
            className={"w-full rounded-3xl py-10 text-3xl font-black text-white shadow-lg active:scale-95 " + (photoState==="reading" ? "bg-slate-400" : group.solid + " " + group.hover)}>
            {photoState==="reading" ? "⏳ 読みとり中…" : "📷 ふせんを うつす"}
          </button>
          {thumb && <img src={thumb} alt="とった写真" className="mt-3 max-h-48 w-full rounded-2xl border-4 border-slate-200 object-contain" />}
          {photoMsg && <p className={"mt-3 rounded-2xl p-4 text-xl font-bold " + (photoState==="error" ? "bg-rose-100 text-rose-700" : "bg-emerald-100 text-emerald-700")}>{photoMsg}</p>}
        </section>

        <section className="rounded-3xl border-4 border-white bg-white/90 p-5 shadow-lg">
          <p className="mb-3 text-2xl font-black text-slate-600">{group.name}の ことば</p>
          {cards.length===0 ? (
            <p className="rounded-2xl border-4 border-dashed border-slate-200 p-8 text-center text-xl text-slate-400">まだ ことばが ありません</p>
          ) : (
            <ul className="space-y-3">
              {cards.map((c,i)=>(
                <li key={c.id} className={"flex items-center gap-3 rounded-2xl border-4 p-4 " + group.soft + " " + group.border}>
                  <span className={"flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-xl font-black text-white " + group.solid}>{i+1}</span>
                  {editingId===c.id ? (
                    <input value={editText} autoFocus onChange={e=>setEditText(e.target.value)}
                      onKeyDown={e=>e.key==="Enter"&&saveEdit()} onBlur={saveEdit}
                      className="flex-1 rounded-xl border-4 border-slate-300 px-3 py-2 text-2xl" />
                  ) : (
                    <span className="flex-1 text-2xl font-bold">{c.text}</span>
                  )}
                  <button onClick={()=>{setEditingId(c.id); setEditText(c.text);}} className="rounded-xl bg-white p-3 text-2xl shadow-sm active:scale-95">✏️</button>
                  <button onClick={()=>removeCard(c.id)} className="rounded-xl bg-white p-3 text-2xl shadow-sm active:scale-95">🗑️</button>
                </li>
              ))}
            </ul>
          )}
          {cards.length >= group.target && (
            <p className="mt-4 rounded-2xl bg-emerald-100 p-4 text-center text-xl font-black text-emerald-700">✅ ぜんいん入ったね！ 先生をよんでね</p>
          )}
        </section>

        <section className="rounded-3xl border-4 border-white bg-white/90 p-5 shadow-lg">
          <p className="mb-3 text-2xl font-black text-slate-600">🎵 どんな曲にする？</p>
          <div className="grid grid-cols-2 gap-3 sm:grid-cols-3">
            {GENRES.map(g=>(
              <button key={g.id} onClick={()=>pickGenre(g.id)}
                className={"rounded-2xl border-4 px-2 py-5 shadow-sm active:scale-95 " + (genre===g.id ? "border-white text-white " + group.solid : "border-slate-200 bg-white text-slate-600")}>
                <div className="text-5xl">{g.emoji}</div>
                <div className="text-2xl font-black">{g.label}</div>
                <div className="text-base font-bold opacity-80">{g.sub}</div>
              </button>
            ))}
          </div>
        </section>

        <section className="rounded-3xl border-4 border-white bg-white/90 p-5 shadow-lg">
          <button onClick={()=>setShowSong(v=>!v)} className="w-full text-left text-2xl font-black text-slate-600">
            ✨ {group.name}の かしを 見る {showSong ? "▲" : "▼"}
          </button>
          {showSong && <pre className="mt-3 rounded-2xl bg-slate-900 p-5 text-xl leading-relaxed text-lime-200">{miniLyrics(group, words, genre)}</pre>}
        </section>
      </div>
    </div>
  );
}

/* ============================================================
   教員用画面
   ============================================================ */
function TeacherApp(){
  const emptyData = ()=>{ const d={}; GROUPS.forEach(g=>d[g.id]={genre:"kirakira",cards:[],songUrl:"",updatedAt:0}); return d; };
  const [tab,setTab] = useState(1);
  const [data,setData] = useState(emptyData);
  const [finale,setFinale] = useState({genre:"idol", url:""});
  const [live,setLive] = useState(true);
  const [conn,setConn] = useState("idle");
  const [connMsg,setConnMsg] = useState("");
  const [lastSync,setLastSync] = useState(null);
  const [seed,setSeed] = useState(0);
  const [done,setDone] = useState({});
  const [editingId,setEditingId] = useState(null);
  const [editText,setEditText] = useState("");
  const [bulk,setBulk] = useState("");
  const [draft,setDraft] = useState("");
  const [photoState,setPhotoState] = useState("idle");
  const [photoMsg,setPhotoMsg] = useState("");
  const fileRef = useRef(null);
  const editingRef = useRef(null);
  useEffect(()=>{ editingRef.current = editingId; },[editingId]);

  const pullAll = async ()=>{
    if(editingRef.current) return;
    try{
      const all = await apiGetState();
      setData(prev=>{
        const next={};
        GROUPS.forEach(g=>{
          const d = all["g"+g.id];
          next[g.id] = d ? {
            genre: d.genre||"kirakira",
            songUrl: d.songUrl||"",
            cards: (d.cards||[]).map(c=>({ id:c.id||newId(), text:c.text, part:c.part||defaultPartFor(g.id) })),
            updatedAt: d.updatedAt||0,
          } : prev[g.id];
        });
        return next;
      });
      if(all.finale) setFinale({ genre: all.finale.genre||"idol", url: all.finale.url||"" });
      setConn("ok"); setConnMsg(""); setLastSync(new Date());
    }catch(e){ setConn("ng"); setConnMsg(e.message); }
  };

  useEffect(()=>{
    if(!live) return;
    pullAll();
    const t = setInterval(pullAll, TEACHER_POLL_MS);
    return ()=>clearInterval(t);
  },[live]);

  const updateGroup = (groupId, updater)=>{
    setData(prev=>{
      const cur = prev[groupId] || {genre:"kirakira",cards:[],songUrl:""};
      const next = updater(cur);
      apiSetState("g"+groupId, { groupId, genre:next.genre, cards:next.cards, songUrl:next.songUrl||"", updatedAt: Date.now() })
        .then(()=>setConn("ok")).catch(err=>{ setConn("ng"); setConnMsg(err.message); });
      return { ...prev, [groupId]: { ...next, updatedAt: Date.now() } };
    });
  };

  const writeFinale = (nextFinale)=>{
    setFinale(nextFinale);
    apiSetState("finale", { ...nextFinale, updatedAt: Date.now() }).catch(err=>{ setConn("ng"); setConnMsg(err.message); });
  };

  const addCards = (groupId, texts)=>{
    const clean = texts.map(t=>String(t).trim()).filter(Boolean);
    if(!clean.length) return;
    updateGroup(groupId, cur=>({ ...cur, cards:[...cur.cards, ...clean.map(t=>({id:newId(), text:t, part:defaultPartFor(groupId)}))] }));
  };
  const removeCard = (groupId,id)=> updateGroup(groupId, cur=>({ ...cur, cards: cur.cards.filter(c=>c.id!==id) }));
  const saveEdit = (groupId)=>{
    const t = editText.trim();
    if(t) updateGroup(groupId, cur=>({ ...cur, cards: cur.cards.map(c=>c.id===editingId?{...c,text:t}:c) }));
    setEditingId(null); setEditText("");
  };
  const setGenre = (groupId,genre)=> updateGroup(groupId, cur=>({...cur, genre}));
  const setSongUrl = (groupId,songUrl)=> updateGroup(groupId, cur=>({...cur, songUrl}));
  const cyclePart = (groupId,id)=> updateGroup(groupId, cur=>({ ...cur,
    cards: cur.cards.map(c=> c.id===id ? {...c, part: PART_ORDER[(PART_ORDER.indexOf(c.part)+1)%PART_ORDER.length]} : c) }));
  const setGroupPart = (groupId,part)=> updateGroup(groupId, cur=>({ ...cur, cards: cur.cards.map(c=>({...c, part})) }));

  const loadDemo = ()=>{
    GROUPS.forEach(g=>{
      const cards = (DEMO[g.id]||[]).map(t=>({id:newId(), text:t, part:defaultPartFor(g.id)}));
      updateGroup(g.id, cur=>({...cur, cards}));
    });
  };
  const clearAll = async ()=>{
    if(!window.confirm("全部のデータを消します。よろしいですか？")) return;
    try{ await apiReset(); }catch(e){}
    setData(emptyData()); setFinale({genre:finale.genre, url:""}); setDone({});
  };

  const onPickPhoto = async (groupId, e)=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    setPhotoState("reading"); setPhotoMsg("");
    try{
      const found = await readStickyNotes(file);
      if(!found.length){ setPhotoState("error"); setPhotoMsg("付箋を読み取れませんでした。明るい場所で真上から撮り直してください。"); }
      else { addCards(groupId, found); setPhotoState("done"); setPhotoMsg(found.length + "件を読み取りました。誤読は ✏️ で修正できます。"); }
    }catch(err){ setPhotoState("error"); setPhotoMsg("読み取りに失敗しました：" + err.message); }
    if(fileRef.current) fileRef.current.value="";
  };

  const allCards = useMemo(()=>GROUPS.flatMap(g=>(data[g.id]?.cards||[]).map(c=>({...c, groupId:g.id}))),[data]);
  const total = allCards.length;
  const progress = Math.min(100, Math.round(total/TOTAL_MEMBERS*100));

  const groupLyrics = (g)=>{
    const words = rotate((data[g.id]?.cards||[]).map(c=>c.text), seed);
    if(!words.length) return "（" + g.name + "の言葉が届くと、ここに歌詞が出ます）";
    return miniLyrics(g, words, data[g.id]?.genre);
  };

  const finaleLyrics = useMemo(()=>{
    if(!allCards.length) return "（言葉が届くと、ここに29人の歌詞が出ます）";
    const pick = p => rotate(allCards.filter(c=>c.part===p).map(c=>c.text), seed);
    const v1=pick("v1"), v2=pick("v2"), br=pick("br"), ch=pick("ch");
    const core = ch.length ? ch : rotate(allCards.map(c=>c.text), seed+3).slice(0,4);
    const hook = "キラキラ ひかる ぼくらの なつ";
    return [
      "[Intro]","ラララ… なつのおと","みんなでうたおう せーの!","",
      "[Verse 1]", v1.length?toLines(v1,2):"（1番に言葉を割り振ってください）","",
      "[Chorus]", hook, toLines(core.slice(0,4),2), "て を つないで もういちど","",
      "[Verse 2]", v2.length?toLines(v2,2):"（2番に言葉を割り振ってください）","",
      "[Chorus]", hook, toLines(core.slice(0,4),2), "て を つないで もういちど","",
      "[Bridge]", br.length?toLines(br,2):"（ブリッジに言葉を割り振ってください）","なつは おわっても きえないよ","",
      "[Chorus]","（大合唱）", hook, toLines(core,2), "29人の うたが そらへ","",
      "[Outro]","ラララ… またあおうね","ぼくらの なつやすみ",
    ].join("\n");
  },[allCards,seed]);

  const finaleStyle = useMemo(()=>{
    const g = FINALE_GENRES.find(x=>x.id===finale.genre) || FINALE_GENRES[0];
    return g.style + ", japanese lyrics, 29 elementary school children, big group chorus, layered harmonies, grand finale, joyful and emotional";
  },[finale.genre]);

  const songListText = useMemo(()=>{
    const rows = GROUPS.filter(g=>data[g.id]?.songUrl).map(g=>g.name + "：" + data[g.id].songUrl);
    if(finale.url) rows.push("全体ソング：" + finale.url);
    return rows.length ? rows.join("\n") : "（まだ登録された曲がありません）";
  },[data, finale.url]);

  const active = typeof tab === "number" ? GROUPS.find(g=>g.id===tab) : null;

  return (
    <div className="min-h-screen bg-gradient-to-b from-slate-100 via-sky-50 to-amber-50 p-4 text-slate-800">
      <header className="mx-auto mb-4 max-w-7xl rounded-3xl border-4 border-white bg-gradient-to-r from-indigo-500 via-sky-500 to-teal-400 p-5 shadow-xl">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h1 className="text-3xl font-black text-white drop-shadow md:text-4xl">☀️ 教員コンソール</h1>
            <p className="text-lg font-bold text-white/90">生徒の入力を受信 → Sunoで曲にする → 曲URLを登録</p>
          </div>
          <div className="flex flex-wrap gap-2">
            <button onClick={loadDemo} className="rounded-2xl bg-white px-4 py-3 text-lg font-black text-indigo-600 shadow-md active:scale-95">🪄 デモデータ一括投入</button>
            <button onClick={clearAll} className="rounded-2xl bg-white/85 px-4 py-3 text-lg font-black text-slate-600 shadow-md active:scale-95">🗑️ 全消去</button>
            <a href="#" className="rounded-2xl bg-white/85 px-4 py-3 text-lg font-black text-slate-600 shadow-md">👦 生徒用へ</a>
          </div>
        </div>

        <div className="mt-4 flex flex-wrap items-center gap-3 rounded-2xl bg-white/90 p-4">
          <button onClick={()=>setLive(v=>!v)} className={"rounded-xl px-4 py-2 text-lg font-black text-white shadow " + (live?"bg-emerald-500":"bg-slate-400")}>
            📡 {live ? "自動受信 中" : "自動受信 停止"}
          </button>
          <button onClick={pullAll} className="rounded-xl bg-slate-600 px-4 py-2 text-lg font-black text-white shadow">🔄 いま受信</button>
          <span className="text-lg font-bold text-slate-500">
            {conn==="ng" ? "⚠️ 通信エラー：" + connMsg
              : lastSync ? "最終受信 " + lastSync.toLocaleTimeString("ja-JP") : "受信待ち…"}
          </span>
        </div>

        <div className="mt-3 rounded-2xl bg-white/90 p-4">
          <div className="mb-2 flex flex-wrap items-center justify-between gap-2">
            <span className="text-xl font-black text-slate-700">👥 入力済み {total} / {TOTAL_MEMBERS} 名</span>
            <div className="flex flex-wrap gap-2">
              {GROUPS.map(g=>(
                <span key={g.id} className={"rounded-full px-3 py-1 text-base font-bold text-white " + g.chip}>
                  {g.emoji} {g.name} {(data[g.id]?.cards||[]).length}/{g.target}{data[g.id]?.songUrl?" 🎵":""}{done[g.id]?" ✅":""}
                </span>
              ))}
            </div>
          </div>
          <div className="h-6 w-full overflow-hidden rounded-full bg-slate-200">
            <div className="flex h-6 items-center justify-end rounded-full bg-gradient-to-r from-lime-400 to-emerald-500 pr-2 text-sm font-black text-white transition-all duration-500"
              style={{ width: Math.max(progress,6) + "%" }}>{progress}%</div>
          </div>
        </div>
      </header>

      <nav className="mx-auto mb-4 flex max-w-7xl flex-wrap gap-2">
        {GROUPS.map(g=>(
          <button key={g.id} onClick={()=>setTab(g.id)}
            className={"rounded-2xl border-4 px-5 py-3 text-xl font-black shadow active:scale-95 " + (tab===g.id ? g.solid + " border-white text-white" : g.tabOff)}>
            {g.emoji} {g.name} <span className="rounded-full bg-black/15 px-2 py-0.5 text-base">{(data[g.id]?.cards||[]).length}</span>
          </button>
        ))}
        <button onClick={()=>setTab("finale")}
          className={"rounded-2xl border-4 px-5 py-3 text-xl font-black shadow active:scale-95 " + (tab==="finale" ? "border-yellow-500 bg-gradient-to-r from-yellow-400 to-orange-500 text-white" : "border-yellow-300 bg-white text-orange-500")}>
          🌟 全員合体フィナーレ
        </button>
      </nav>

      {active && (
        <main className="mx-auto grid max-w-7xl gap-4 lg:grid-cols-12">
          <section className="lg:col-span-5">
            <div className={"rounded-3xl border-4 bg-white/90 shadow-lg " + active.border}>
              <div className={"flex items-center justify-between rounded-t-2xl px-5 py-3 text-2xl font-black text-white " + active.solid}>
                <span>{active.emoji} {active.name} の言葉</span>
                <span className="text-lg">{(data[active.id]?.cards||[]).length} / {active.target} 名</span>
              </div>
              <div className="space-y-4 p-4">
                <ul className="space-y-2">
                  {(data[active.id]?.cards||[]).length===0 && (
                    <li className="rounded-2xl border-4 border-dashed border-slate-200 p-6 text-center text-lg text-slate-400">
                      まだ届いていません。生徒用ページで{active.name}を選んで入力してもらってください。
                    </li>
                  )}
                  {(data[active.id]?.cards||[]).map((c,i)=>(
                    <li key={c.id} className={"flex items-center gap-2 rounded-2xl border-4 p-3 " + active.soft + " " + active.border}>
                      <span className={"flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-lg font-black text-white " + active.chip}>{i+1}</span>
                      {editingId===c.id ? (
                        <input value={editText} autoFocus onChange={e=>setEditText(e.target.value)}
                          onKeyDown={e=>e.key==="Enter"&&saveEdit(active.id)} onBlur={()=>saveEdit(active.id)}
                          className="flex-1 rounded-xl border-2 border-slate-300 px-3 py-2 text-xl" />
                      ) : <span className="flex-1 text-xl font-bold">{c.text}</span>}
                      <button onClick={()=>{setEditingId(c.id); setEditText(c.text);}} className="rounded-xl bg-white/70 p-2 text-xl">✏️</button>
                      <button onClick={()=>removeCard(active.id,c.id)} className="rounded-xl bg-white/70 p-2 text-xl">🗑️</button>
                    </li>
                  ))}
                </ul>

                <div className="rounded-2xl bg-slate-50 p-4">
                  <p className="mb-2 text-lg font-black text-slate-600">付箋を写真で取り込む</p>
                  <input ref={fileRef} type="file" accept="image/*" onChange={e=>onPickPhoto(active.id,e)} className="hidden" />
                  <button onClick={()=>fileRef.current && fileRef.current.click()} disabled={photoState==="reading"}
                    className={"w-full rounded-2xl py-4 text-xl font-black text-white shadow active:scale-95 " + (photoState==="reading" ? "bg-slate-400" : active.solid)}>
                    {photoState==="reading" ? "⏳ 読み取り中…" : "📷 写真を選んで" + active.name + "に追加"}
                  </button>
                  {photoMsg && <p className={"mt-2 rounded-xl p-3 text-lg font-bold " + (photoState==="error" ? "bg-rose-100 text-rose-700" : "bg-emerald-100 text-emerald-700")}>{photoMsg}</p>}

                  <p className="mb-2 mt-4 text-lg font-black text-slate-600">代理入力（1件ずつ）</p>
                  <div className="mb-3 flex gap-2">
                    <input value={draft} onChange={e=>setDraft(e.target.value)}
                      onKeyDown={e=>{ if(e.key==="Enter"){ addCards(active.id,[draft]); setDraft(""); } }}
                      placeholder="欠席・端末トラブル時に"
                      className="flex-1 rounded-2xl border-4 border-slate-200 px-4 py-3 text-xl focus:border-slate-400 focus:outline-none" />
                    <button onClick={()=>{ addCards(active.id,[draft]); setDraft(""); }}
                      className={"rounded-2xl px-5 text-2xl text-white shadow " + active.solid}>＋</button>
                  </div>

                  <p className="mb-2 text-lg font-black text-slate-600">テキストを一括貼り付け</p>
                  <textarea value={bulk} onChange={e=>setBulk(e.target.value)} rows={4}
                    placeholder="改行・カンマ・読点で区切って貼り付け"
                    className="w-full rounded-2xl border-4 border-slate-200 p-3 text-lg focus:border-slate-400 focus:outline-none" />
                  <button onClick={()=>{ addCards(active.id, bulk.split(/[\n,、，]/)); setBulk(""); }}
                    className={"mt-2 w-full rounded-2xl py-3 text-xl font-black text-white shadow " + active.solid}>まとめてカードにする</button>
                </div>
              </div>
            </div>
          </section>

          <section className="space-y-4 lg:col-span-7">
            <div className="rounded-3xl border-4 border-white bg-white/90 p-4 shadow-lg">
              <div className="mb-3 text-xl font-black text-slate-700">🎵 {active.name}の曲調（生徒の選択を上書きできます）</div>
              <div className="grid grid-cols-2 gap-2 md:grid-cols-3">
                {GENRES.map(gen=>(
                  <button key={gen.id} onClick={()=>setGenre(active.id, gen.id)}
                    className={"rounded-2xl border-4 px-3 py-4 shadow-sm active:scale-95 " + (data[active.id]?.genre===gen.id ? active.solid + " border-white text-white" : "border-slate-200 bg-white text-slate-600")}>
                    <div className="text-4xl">{gen.emoji}</div>
                    <div className="text-xl font-black">{gen.label}</div>
                    <div className="text-sm font-bold opacity-80">{gen.sub}</div>
                  </button>
                ))}
              </div>
              <div className="mt-3 flex flex-wrap gap-2">
                <button onClick={()=>setSeed(s=>s+1)} className="rounded-2xl bg-slate-600 px-4 py-3 text-lg font-bold text-white shadow active:scale-95">🔄 歌詞を並べかえる</button>
                <button onClick={()=>setDone(p=>({...p,[active.id]:!p[active.id]}))}
                  className={"rounded-2xl px-4 py-3 text-lg font-black text-white shadow active:scale-95 " + (done[active.id]?"bg-emerald-500":"bg-slate-400")}>
                  {done[active.id] ? "✅ この班 完了" : "完了チェック"}
                </button>
              </div>
            </div>

            <OutputBox title={active.name + "のミニソング歌詞（30〜45秒）"} text={groupLyrics(active)} copyLabel="班の歌詞をコピー" btnClass={active.solid} />
            <OutputBox title={active.name + "のStyleプロンプト"} text={groupStyleText(data[active.id]?.genre)} copyLabel="班のスタイルをコピー" btnClass={active.solid} />
            <SunoPanel lyrics={groupLyrics(active)} songUrl={data[active.id]?.songUrl||""} onSaveUrl={u=>setSongUrl(active.id,u)} accent={active.solid} />
          </section>
        </main>
      )}

      {tab==="finale" && (
        <main className="mx-auto max-w-7xl space-y-4">
          <section className="rounded-3xl border-4 border-yellow-300 bg-white/90 p-4 shadow-lg">
            <div className="mb-3 flex flex-wrap items-center justify-between gap-3">
              <h2 className="text-2xl font-black text-orange-600">🎉 29人の言葉マップ（カードをクリックでパート変更）</h2>
              <div className="flex flex-wrap gap-2">
                {PARTS.map(p=><span key={p.id} className={"rounded-full px-3 py-1 text-base font-bold text-white " + p.cls}>{p.label}</span>)}
              </div>
            </div>
            {allCards.length===0 ? (
              <p className="rounded-2xl border-4 border-dashed border-slate-200 p-8 text-center text-xl text-slate-400">まだ言葉が届いていません。</p>
            ) : (
              <div className="space-y-3">
                {GROUPS.map(g=>(
                  <div key={g.id} className={"rounded-2xl border-4 p-3 " + g.soft + " " + g.border}>
                    <div className="mb-2 flex flex-wrap items-center gap-2">
                      <span className={"rounded-full px-3 py-1 text-lg font-black text-white " + g.chip}>{g.emoji} {g.name}</span>
                      <span className="text-base font-bold text-slate-500">一括変更：</span>
                      {PARTS.map(p=>(
                        <button key={p.id} onClick={()=>setGroupPart(g.id,p.id)}
                          className={"rounded-xl px-3 py-1 text-base font-bold text-white shadow-sm active:scale-95 " + p.cls}>{p.short}へ</button>
                      ))}
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {(data[g.id]?.cards||[]).length===0 && <span className="text-lg text-slate-400">（未受信）</span>}
                      {(data[g.id]?.cards||[]).map(c=>{
                        const part = PARTS.find(p=>p.id===c.part) || PARTS[0];
                        return (
                          <button key={c.id} onClick={()=>cyclePart(g.id,c.id)}
                            className="flex items-center gap-2 rounded-2xl border-4 border-white bg-white px-3 py-2 text-lg font-bold shadow-sm active:scale-95">
                            <span className={"rounded-full px-2 py-0.5 text-sm font-black text-white " + part.cls}>{part.short}</span>
                            {c.text}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </section>

          <section className="rounded-3xl border-4 border-white bg-white/90 p-4 shadow-lg">
            <div className="mb-3 text-2xl font-black text-slate-700">🌟 クラス全体の曲のジャンル</div>
            <div className="grid grid-cols-2 gap-3 md:grid-cols-5">
              {FINALE_GENRES.map(gen=>(
                <button key={gen.id} onClick={()=>writeFinale({...finale, genre:gen.id})}
                  className={"rounded-2xl border-4 px-3 py-5 text-lg font-black shadow-sm active:scale-95 " + (finale.genre===gen.id ? "border-white bg-gradient-to-r from-orange-400 to-pink-500 text-white" : "border-slate-200 bg-white text-slate-600")}>
                  <div className="text-4xl">{gen.emoji}</div>{gen.label}
                </button>
              ))}
            </div>
            <button onClick={()=>setSeed(s=>s+1)} className="mt-3 rounded-2xl bg-slate-600 px-4 py-3 text-lg font-bold text-white shadow active:scale-95">🔄 歌詞を並べかえる</button>
          </section>

          <section className="grid gap-4 lg:grid-cols-2">
            <OutputBox title="全体ソングの歌詞（SunoのLyrics欄へ）" text={finaleLyrics} copyLabel="全体の歌詞をコピー" btnClass="bg-gradient-to-r from-orange-500 to-pink-500" />
            <OutputBox title="全体ソングのStyleプロンプト（SunoのStyle欄へ）" text={finaleStyle} copyLabel="全体のスタイルをコピー" btnClass="bg-gradient-to-r from-sky-500 to-indigo-500" />
          </section>

          <SunoPanel lyrics={finaleLyrics} songUrl={finale.url} onSaveUrl={u=>writeFinale({...finale, url:u})} accent="bg-gradient-to-r from-orange-500 to-pink-500" />

          <section className="rounded-3xl border-4 border-white bg-white/90 p-4 shadow-lg">
            <div className="mb-3 text-2xl font-black text-slate-700">▶ できた曲リスト（鑑賞タイム用）</div>
            <div className="grid gap-2 md:grid-cols-2">
              {GROUPS.map(g=> data[g.id]?.songUrl ? (
                <a key={g.id} href={data[g.id].songUrl} target="_blank" rel="noopener noreferrer"
                  className={"rounded-2xl px-5 py-4 text-xl font-black text-white shadow " + g.chip}>▶ {g.emoji} {g.name}の曲を聴く</a>
              ) : (
                <div key={g.id} className="rounded-2xl border-4 border-dashed border-slate-200 px-5 py-4 text-xl font-bold text-slate-400">{g.emoji} {g.name}：URL未登録</div>
              ))}
              {finale.url && (
                <a href={finale.url} target="_blank" rel="noopener noreferrer"
                  className="rounded-2xl bg-gradient-to-r from-orange-500 to-pink-500 px-5 py-4 text-xl font-black text-white shadow md:col-span-2">🌟 29人の全体ソングを聴く</a>
              )}
            </div>
            <div className="mt-3"><CopyButton text={songListText} label="全部のURLをまとめてコピー" className="bg-slate-700" /></div>
          </section>
        </main>
      )}
    </div>
  );
}

/* ============================================================
   入り口（#teacher で教員用）
   ============================================================ */
function App(){
  const [hash,setHash] = useState(window.location.hash);
  useEffect(()=>{
    const on = ()=>setHash(window.location.hash);
    window.addEventListener("hashchange", on);
    return ()=>window.removeEventListener("hashchange", on);
  },[]);

  if(!API || API.indexOf("XXXXXXXXXXXX") >= 0){
    return (
      <div className="min-h-screen bg-amber-50 p-8">
        <div className="mx-auto max-w-2xl rounded-3xl border-4 border-amber-300 bg-white p-8">
          <h1 className="mb-4 text-3xl font-black text-amber-700">設定がまだです</h1>
          <p className="text-xl leading-relaxed text-slate-700">
            config.js の <code className="rounded bg-slate-100 px-2">API_BASE</code> に、GASウェブアプリのURL（/exec で終わるもの）を書いてください。
            手順は README.md を参照してください。
          </p>
        </div>
      </div>
    );
  }
  return hash === "#teacher" ? <TeacherApp /> : <StudentApp />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
