<meta charset="utf-8" />

<title>なつのうた｜みんなの言葉で音楽をつくろう</title>

<style>
/* ============================================================
   なつのうた 専用スタイル
   外部CDNに頼らず、このファイルだけで見た目が完成します。
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  color:#0f172a;
  background:#f8fafc;
  -webkit-font-smoothing:antialiased;
}
h1,h2,p,pre,ul,figure{margin:0}
ul{list-style:none;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* 押した感じを出す */
button,a{transition:transform .12s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
button:active,a:active{transform:scale(.96)}

/* 入力欄 */
input,textarea,select{background:#fff;border-radius:1.1rem;outline:none}
select{padding:.5rem .9rem;border:4px solid #e2e8f0}
input::placeholder,textarea::placeholder{color:#94a3b8}

/* カードが増えたときにふわっと出す */
li{animation:nu-in .28s ease both}
@keyframes nu-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes nu-pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- GASウェブアプリとの通信 ----------
   Content-Type を text/plain にしているのは、
   ブラウザのプリフライト（OPTIONS）を避けるため。
   GASはOPTIONSに応答できないので、これが定石。
-------------------------------------------------- */
const CFG = window.APP_CONFIG || {};
const API = (CFG.API_BASE || "").trim();
const TOKEN = CFG.APP_TOKEN || "";

async function gas(action, payload){
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action, token: TOKEN }, payload || {})),
  });
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

/* ---------- 写真の読み取り ---------- */
function shrinkToBase64(file, maxSide=1400){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*scale);
      cv.height = Math.round(img.height*scale);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg",0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読めません")); };
    img.src = url;
  });
}

const OCR_PROMPT =
  "小学生が付箋に書いた「夏の思い出」の写真です。付箋を1枚ずつ読み取ってください。\n" +
  "・文字が書いてある付箋は、書かれたとおりの日本語で書き起こす（ひらがな・カタカナもそのまま）\n" +
  "・絵だけの付箋は、その絵の内容を小学生が言いそうな短い日本語にする（例：花火の絵→「はなびがきれい」）\n" +
  "・1枚につき1つ、15文字くらいまでの短いフレーズにする\n" +
  "・読み取れない付箋、付箋以外の物、人の名前は入れない\n" +
  "出力は文字列のJSON配列だけ。前置き・説明・コードブロック記号は一切書かないこと。\n" +
  '例: ["うみでおよいだ","すいかがあまかった"]';

async function readStickyNotes(file){
  const b64 = await shrinkToBase64(file);
  const data = await gas("claude", { messages: [{ role:"user", content:[
    { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:b64 } },
    { type:"text", text: OCR_PROMPT }
  ]}]});
  const text = (data.content||[]).filter(i=>i.type==="text").map(i=>i.text).join("\n");
  const clean = text.replace(/```json|```/g,"").trim();
  const parsed = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]")+1));
  return Array.isArray(parsed) ? parsed.filter(t=>typeof t==="string") : [];
}

/* ---------- 歌詞づくり ---------- */
function miniLyrics(group, words, genreId){
  const genre = GENRES.find(g=>g.id===genreId) || GENRES[0];
  if(words.length===0) return "（ことばを入れると、ここに歌ができるよ）";

  // 言葉が多いほど [Verse] を増やす（1ブロックにつき最大6語）
  const per = 6;
  const verseWords = words.slice(0, Math.max(words.length - 2, per)); // 最後の2語はサビ用に残す
  const chorusWords = words.slice(-2);
  const blocks = chunk(verseWords.length ? verseWords : words, per);

  const out = [];
  blocks.forEach((b, i)=>{
    out.push("[Verse" + (blocks.length > 1 ? " " + (i+1) : "") + "]");
    out.push(toLines(b, 2));
    if(i === 0) out.push(genre.hook + " ぼくらの なつやすみ");
    out.push("");
  });
  out.push("[Chorus]");
  out.push(group.name + "のなつ! " + words[0]);
  out.push(toLines(chorusWords.length ? chorusWords : words.slice(0,2), 2));
  out.push("わすれないよ このきもち");
  out.push(genre.hook + " " + genre.hook + " ぼくらのうた");
  return out.join("\n");
}

/* ============================================================
   音声入力
   ============================================================ */
function useSpeech(onFinal){
  const [listening,setListening] = useState(false);
  const [interim,setInterim] = useState("");
  const [ok,setOk] = useState(true);
  const recogRef = useRef(null);
  const cbRef = useRef(onFinal);
  useEffect(()=>{ cbRef.current = onFinal; });

  useEffect(()=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ setOk(false); return; }
    const r = new SR();
    r.lang="ja-JP"; r.continuous=true; r.interimResults=true;
    r.onresult = (ev)=>{
      let temp="";
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const res=ev.results[i]; const t=res[0].transcript.trim();
        if(res.isFinal){ if(t) cbRef.current([t]); } else temp+=t;
      }
      setInterim(temp);
    };
    r.onend = ()=>{ setListening(false); setInterim(""); };
    r.onerror = ()=>{ setListening(false); setInterim(""); };
    recogRef.current = r;
    return ()=>{ try{ r.stop(); }catch(e){} };
  },[]);

  const toggle = ()=>{
    const r=recogRef.current; if(!r) return;
    if(listening){ try{ r.stop(); }catch(e){} setListening(false); }
    else { try{ r.start(); setListening(true); }catch(e){ setListening(false); } }
  };
  return { listening, interim, ok, toggle };
}

    const s = stateRef.current;
    if(!s.group || !s.sid) return;

      await apiSetState(K(s.sid,"g"+s.group.id), { groupId:s.group.id, genre:nextGenre, cards:nextCards, songUrl:s.songUrl||"", updatedAt:at });

      const s = stateRef.current;
      if(cur !== s.sid){
        // 先生が回を切り替えた。前の回の内容は持ち越さない

/* ============================================================
   教員用画面
   ============================================================ */
function TeacherApp(){
  const emptyData = ()=>{ const d={}; GROUPS.forEach(g=>d[g.id]={genre:"kirakira",cards:[],songUrl:"",updatedAt:0}); return d; };
  const [tab,setTab] = useState(1);
  const [data,setData] = useState(emptyData);
  const [finale,setFinale] = useState({genre:"idol", url:""});
  const [sid,setSid] = useState(null);
  const [sessions,setSessions] = useState([]);
  const [live,setLive] = useState(true);
  const [conn,setConn] = useState("idle");
  const [connMsg,setConnMsg] = useState("");
  const [lastSync,setLastSync] = useState(null);
  const [seed,setSeed] = useState(0);
  const [done,setDone] = useState({});
  const [editingId,setEditingId] = useState(null);
  const [editText,setEditText] = useState("");
  const [bulk,setBulk] = useState("");
  const [draft,setDraft] = useState("");
  const [photoState,setPhotoState] = useState("idle");
  const [photoMsg,setPhotoMsg] = useState("");
  const fileRef = useRef(null);
  const editingRef = useRef(null);
  const sidRef = useRef(null);
  useEffect(()=>{ editingRef.current = editingId; },[editingId]);
  useEffect(()=>{ sidRef.current = sid; },[sid]);

  const pullAll = async ()=>{
    if(editingRef.current) return;
    try{
      const all = await apiGetState();
      setSessions((all.sessions && all.sessions.items) || []);

      const cur = all.current && all.current.id ? all.current.id : null;
      setConn("ok"); setConnMsg(""); setLastSync(new Date());
      if(!cur){ setSid(null); return; }

      const changed = cur !== sidRef.current;
      if(changed){ sidRef.current = cur; setSid(cur); setDone({}); setTab(1); }

      setData(prev=>{
        const next={};
        GROUPS.forEach(g=>{
          const d = all[K(cur,"g"+g.id)];
          next[g.id] = d ? {
            genre: d.genre||"kirakira",
            songUrl: d.songUrl||"",
            cards: (d.cards||[]).map(c=>({ id:c.id||newId(), text:c.text, part:c.part||defaultPartFor(g.id) })),
            updatedAt: d.updatedAt||0,
          } : (changed ? { genre:"kirakira", cards:[], songUrl:"", updatedAt:0 } : prev[g.id]);
        });
        return next;
      });

      const fin = all[K(cur,"finale")];
      if(fin) setFinale({ genre: fin.genre||"idol", url: fin.url||"" });
      else if(changed) setFinale({ genre:"idol", url:"" });
    }catch(e){ setConn("ng"); setConnMsg(e.message); }
  };

  useEffect(()=>{
    if(!live) return;
    pullAll();
    const t = setInterval(pullAll, TEACHER_POLL_MS);
    return ()=>clearInterval(t);
  },[live]);

  const updateGroup = (groupId, updater)=>{
    setData(prev=>{
      const cur = prev[groupId] || {genre:"kirakira",cards:[],songUrl:""};
      const next = updater(cur);
      if(!sidRef.current){ return prev; }
      apiSetState(K(sidRef.current,"g"+groupId), { groupId, genre:next.genre, cards:next.cards, songUrl:next.songUrl||"", updatedAt: Date.now() })
        .then(()=>setConn("ok")).catch(err=>{ setConn("ng"); setConnMsg(err.message); });
      return { ...prev, [groupId]: { ...next, updatedAt: Date.now() } };
    });
  };

  const writeFinale = (nextFinale)=>{
    setFinale(nextFinale);
    if(!sidRef.current) return;
    apiSetState(K(sidRef.current,"finale"), { ...nextFinale, updatedAt: Date.now() }).catch(err=>{ setConn("ng"); setConnMsg(err.message); });
  };

  /* ---------- 回の操作 ---------- */

  const startSession = async (labelInput)=>{
    const base = todayStamp();
    const nth = sessions.filter(s=>s.id.indexOf(base) === 0).length + 1;
    const d = new Date();
    const id = base + "-" + nth;
    const label = (labelInput && labelInput.trim())
      ? labelInput.trim()
      : (d.getMonth()+1) + "/" + d.getDate() + " 第" + nth + "回";
    const next = [...sessions, { id, label }];
    try{
      await apiSetState("sessions", { items: next, updatedAt: Date.now() });
      await apiSetState("current", { id, updatedAt: Date.now() });
      setSessions(next); sidRef.current = id; setSid(id);
      setData(emptyData()); setFinale({genre:"idol", url:""}); setDone({}); setTab(1);
    }catch(err){ setConn("ng"); setConnMsg(err.message); }
  };

  const switchSession = async (id)=>{
    if(!id || id === sid) return;
    try{
      await apiSetState("current", { id, updatedAt: Date.now() });
      sidRef.current = id; setSid(id);
      setData(emptyData()); setFinale({genre:"idol", url:""}); setDone({}); setTab(1);
      pullAll();
    }catch(err){ setConn("ng"); setConnMsg(err.message); }
  };

  const renameSession = async ()=>{
    if(!sid) return;
    const cur = labelOf(sessions, sid);
    const name = window.prompt("この回の名前", cur);
    if(name === null) return;
    const next = sessions.map(s=> s.id===sid ? { ...s, label: name.trim() || cur } : s);
    try{
      await apiSetState("sessions", { items: next, updatedAt: Date.now() });
      setSessions(next);
    }catch(err){ setConn("ng"); setConnMsg(err.message); }
  };

  const addCards = (groupId, texts)=>{
    const clean = texts.map(t=>String(t).trim()).filter(Boolean);
    if(!clean.length) return;
    updateGroup(groupId, cur=>({ ...cur, cards:[...cur.cards, ...clean.map(t=>({id:newId(), text:t, part:defaultPartFor(groupId)}))] }));
  };
  const removeCard = (groupId,id)=> updateGroup(groupId, cur=>({ ...cur, cards: cur.cards.filter(c=>c.id!==id) }));
  const saveEdit = (groupId)=>{
    const t = editText.trim();
    if(t) updateGroup(groupId, cur=>({ ...cur, cards: cur.cards.map(c=>c.id===editingId?{...c,text:t}:c) }));

  const setGenre = (groupId,genre)=> updateGroup(groupId, cur=>({...cur, genre}));
  const setSongUrl = (groupId,songUrl)=> updateGroup(groupId, cur=>({...cur, songUrl}));
  const cyclePart = (groupId,id)=> updateGroup(groupId, cur=>({ ...cur,
    cards: cur.cards.map(c=> c.id===id ? {...c, part: PART_ORDER[(PART_ORDER.indexOf(c.part)+1)%PART_ORDER.length]} : c) }));
  const setGroupPart = (groupId,part)=> updateGroup(groupId, cur=>({ ...cur, cards: cur.cards.map(c=>({...c, part})) }));

  const loadDemo = ()=>{
    GROUPS.forEach(g=>{
      const cards = (DEMO[g.id]||[]).map(t=>({id:newId(), text:t, part:defaultPartFor(g.id)}));
      updateGroup(g.id, cur=>({...cur, cards}));
    });
  };
  const clearSession = async ()=>{
    if(!sid) return;
    if(!window.confirm("「" + labelOf(sessions, sid) + "」の言葉を全部消します。ほかの回は残ります。よろしいですか？")) return;
    try{ await apiReset(sid); }catch(e){}
    setData(emptyData()); setFinale({genre:finale.genre, url:""}); setDone({});
  };

  const clearEverything = async ()=>{
    if(!window.confirm("すべての回のデータを消します。元に戻せません。よろしいですか？")) return;
    try{ await apiReset(null); }catch(e){}
    setSessions([]); sidRef.current = null; setSid(null);
    setData(emptyData()); setFinale({genre:"idol", url:""}); setDone({});
  };

  const onPickPhoto = async (groupId, e)=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    setPhotoState("reading"); setPhotoMsg("");
    try{
      const found = await readStickyNotes(file);
      if(!found.length){ setPhotoState("error"); setPhotoMsg("付箋を読み取れませんでした。明るい場所で真上から撮り直してください。"); }
      else { addCards(groupId, found); setPhotoState("done"); setPhotoMsg(found.length + "件を読み取りました。誤読は ✏️ で修正できます。"); }
    }catch(err){ setPhotoState("error"); setPhotoMsg("読み取りに失敗しました：" + err.message); }
    if(fileRef.current) fileRef.current.value="";
  };

  const allCards = useMemo(()=>GROUPS.flatMap(g=>(data[g.id]?.cards||[]).map(c=>({...c, groupId:g.id}))),[data]);
  const total = allCards.length;
  const progress = Math.min(100, Math.round(total/TOTAL_MEMBERS*100));

  const groupLyrics = (g)=>{
    const words = rotate((data[g.id]?.cards||[]).map(c=>c.text), seed);
    if(!words.length) return "（" + g.name + "の言葉が届くと、ここに歌詞が出ます）";
    return miniLyrics(g, words, data[g.id]?.genre);
  };

  const finaleLyrics = useMemo(()=>{
    if(!allCards.length) return "（言葉が届くと、ここに29人の歌詞が出ます）";
    const pick = p => rotate(allCards.filter(c=>c.part===p).map(c=>c.text), seed);
    const v1=pick("v1"), v2=pick("v2"), br=pick("br"), ch=pick("ch");
    const core = ch.length ? ch : rotate(allCards.map(c=>c.text), seed+3).slice(0,4);
    const hook = "キラキラ ひかる ぼくらの なつ";
    return [
      "[Intro]","ラララ… なつのおと","みんなでうたおう せーの!","",
      "[Verse 1]", v1.length?toLines(v1,2):"（1番に言葉を割り振ってください）","",
      "[Chorus]", hook, toLines(core.slice(0,4),2), "て を つないで もういちど","",
      "[Verse 2]", v2.length?toLines(v2,2):"（2番に言葉を割り振ってください）","",
      "[Chorus]", hook, toLines(core.slice(0,4),2), "て を つないで もういちど","",
      "[Bridge]", br.length?toLines(br,2):"（ブリッジに言葉を割り振ってください）","なつは おわっても きえないよ","",
      "[Chorus]","（大合唱）", hook, toLines(core,2), "29人の うたが そらへ","",
      "[Outro]","ラララ… またあおうね","ぼくらの なつやすみ",
    ].join("\n");
  },[allCards,seed]);

  const finaleStyle = useMemo(()=>{
    const g = FINALE_GENRES.find(x=>x.id===finale.genre) || FINALE_GENRES[0];
    return g.style + ", japanese lyrics, 29 elementary school children, big group chorus, layered harmonies, grand finale, joyful and emotional";
  },[finale.genre]);

  const songListText = useMemo(()=>{
    const rows = GROUPS.filter(g=>data[g.id]?.songUrl).map(g=>g.name + "：" + data[g.id].songUrl);
    if(finale.url) rows.push("全体ソング：" + finale.url);
    return rows.length ? rows.join("\n") : "（まだ登録された曲がありません）";

                <div className="rounded-2xl bg-slate-50 p-4">

                  <button onClick={()=>fileRef.current && fileRef.current.click()} disabled={photoState==="reading"}

                    <button onClick={()=>{ addCards(active.id,[draft]); setDraft(""); }}

                  </div>

                  <p className="mb-2 text-lg font-black text-slate-600">テキストを一括貼り付け</p>
                  <textarea value={bulk} onChange={e=>setBulk(e.target.value)} rows={4}

                  <button onClick={()=>{ addCards(active.id, bulk.split(/[\n,、，]/)); setBulk(""); }}
                    className={"mt-2 w-full rounded-2xl py-3 text-xl font-black text-white shadow " + active.solid}>まとめてカードにする</button>
                </div>
              </div>
            </div>
          </section>

          <section className="space-y-4 lg:col-span-7">
            <div className="rounded-3xl border-4 border-white bg-white/90 p-4 shadow-lg">
              <div className="mb-3 text-xl font-black text-slate-700">🎵 {active.name}の曲調（生徒の選択を上書きできます）</div>
              <div className="grid grid-cols-2 gap-2 md:grid-cols-3">
                {GENRES.map(gen=>(
                  <button key={gen.id} onClick={()=>setGenre(active.id, gen.id)}
                    className={"rounded-2xl border-4 px-3 py-4 shadow-sm active:scale-95 " + (data[active.id]?.genre===gen.id ? active.solid + " border-white text-white" : "border-slate-200 bg-white text-slate-600")}>
                    <div className="text-4xl">{gen.emoji}</div>
                    <div className="text-xl font-black">{gen.label}</div>
                    <div className="text-sm font-bold opacity-80">{gen.sub}</div>
                  </button>
                ))}
              </div>
              <div className="mt-3 flex flex-wrap gap-2">
                <button onClick={()=>setSeed(s=>s+1)} className="rounded-2xl bg-slate-600 px-4 py-3 text-lg font-bold text-white shadow active:scale-95">🔄 歌詞を並べかえる</button>
                <button onClick={()=>setDone(p=>({...p,[active.id]:!p[active.id]}))}
                  className={"rounded-2xl px-4 py-3 text-lg font-black text-white shadow active:scale-95 " + (done[active.id]?"bg-emerald-500":"bg-slate-400")}>
                  {done[active.id] ? "✅ この班 完了" : "完了チェック"}
                </button>
              </div>
            </div>

            <OutputBox title={active.name + "のミニソング歌詞（30〜45秒）"} text={groupLyrics(active)} copyLabel="班の歌詞をコピー" btnClass={active.solid} />
            <OutputBox title={active.name + "のStyleプロンプト"} text={groupStyleText(data[active.id]?.genre)} copyLabel="班のスタイルをコピー" btnClass={active.solid} />
            <SunoPanel lyrics={groupLyrics(active)} songUrl={data[active.id]?.songUrl||""} onSaveUrl={u=>setSongUrl(active.id,u)} accent={active.solid} />
          </section>
        </main>
      )}

      {sid && tab==="finale" && (
        <main className="mx-auto max-w-7xl space-y-4">
          <section className="rounded-3xl border-4 border-yellow-300 bg-white/90 p-4 shadow-lg">
            <div className="mb-3 flex flex-wrap items-center justify-between gap-3">
              <h2 className="text-2xl font-black text-orange-600">🎉 29人の言葉マップ（カードをクリックでパート変更）</h2>
              <div className="flex flex-wrap gap-2">
                {PARTS.map(p=><span key={p.id} className={"rounded-full px-3 py-1 text-base font-bold text-white " + p.cls}>{p.label}</span>)}
              </div>
            </div>
            {allCards.length===0 ? (
              <p className="rounded-2xl border-4 border-dashed border-slate-200 p-8 text-center text-xl text-slate-400">まだ言葉が届いていません。</p>
            ) : (
              <div className="space-y-3">
                {GROUPS.map(g=>(
                  <div key={g.id} className={"rounded-2xl border-4 p-3 " + g.soft + " " + g.border}>
                    <div className="mb-2 flex flex-wrap items-center gap-2">
                      <span className={"rounded-full px-3 py-1 text-lg font-black text-white " + g.chip}>{g.emoji} {g.name}</span>
                      <span className="text-base font-bold text-slate-500">一括変更：</span>
                      {PARTS.map(p=>(

                            <span className={"rounded-full px-2 py-0.5 text-sm font-black text-white " + part.cls}>{part.short}</span>

                  className="rounded-2xl bg-gradient-to-r from-orange-500 to-pink-500 px-5 py-4 text-xl font-black text-white shadow md:col-span-2">🌟 29人の全体ソングを聴く</a>
              )}
            </div>
            <div className="mt-3"><CopyButton text={songListText} label="全部のURLをまとめてコピー" className="bg-slate-700" /></div>
          </section>
        </main>
      )}
    </div>
  );
}

<!-- 起動処理：CDNを二重化し、失敗したら画面にエラーを出す -->
<script>
(function () {
  var CDNS = [
    { name: "unpkg",    base: "https://unpkg.com/" },
    { name: "jsDelivr", base: "https://cdn.jsdelivr.net/npm/" }
  ];
  var LIBS = [
    "react@18/umd/react.production.min.js",
    "react-dom@18/umd/react-dom.production.min.js",
    "@babel/standalone/babel.min.js"
  ];
  var log = [];

  function show(title, lines) {
    var html = '<div id="boot"><h1>' + title + "</h1><ul>";
    for (var i = 0; i < lines.length; i++) html += "<li>" + lines[i] + "</li>";
    html += "</ul></div>";
    document.getElementById("root").innerHTML = html;
  }

  function loadScript(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = url;
      s.crossOrigin = "anonymous";
      s.onload = function () { resolve(url); };
      s.onerror = function () { reject(new Error(url)); };
      document.head.appendChild(s);
    });
  }

  function loadWithFallback(path, i) {
    i = i || 0;
    if (i >= CDNS.length) return Promise.reject(new Error(path + " をどのCDNからも読めませんでした"));
    return loadScript(CDNS[i].base + path).then(
      function () { log.push(path.split("/")[0] + " ← " + CDNS[i].name); },
      function () { return loadWithFallback(path, i + 1); }
    );
  }

  // React → ReactDOM → Babel の順に読む
  LIBS.reduce(function (p, path) {
    return p.then(function () { return loadWithFallback(path); });
  }, Promise.resolve())
    .then(function () {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      var s = document.createElement("script");
      s.textContent = out;
      document.body.appendChild(s);
    })
    .catch(function (err) {
      show("部品を読み込めませんでした", [
        "エラー: <code>" + err.message + "</code>",
        "学校のネットワークやブラウザ拡張が CDN を止めている可能性があります。",
        "スマホのテザリングなど別の回線で開くと切り分けできます。",
        "読み込めたもの: " + (log.length ? log.join(" / ") : "なし")
      ]);
    });

  // 起動後のエラーも画面に出す
  window.addEventListener("error", function (e) {
    if (document.getElementById("boot") || !document.getElementById("root").firstChild) {
      show("エラーが発生しました", [
        "<code>" + (e.message || "不明なエラー") + "</code>",
        e.filename ? "場所: <code>" + e.filename + " : " + e.lineno + "</code>" : "",
        "この文面をそのまま伝えてください。"
      ]);
    }
  });
})();
</script>
